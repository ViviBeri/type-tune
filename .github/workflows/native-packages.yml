name: Build native packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: type-tune-linux-x64-gnu
            executable: type-tune
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: type-tune-linux-x64-musl
            executable: type-tune
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: type-tune-darwin-x64
            executable: type-tune
          - runner: macos-15
            target: aarch64-apple-darwin
            package: type-tune-darwin-arm64
            executable: type-tune
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: type-tune-win32-x64-msvc
            executable: type-tune.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build native binary
        run: cargo build --release --target ${{ matrix.target }} -p type-tune

      - name: Smoke test native binary
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.executable }} --help

      - name: Stage platform package
        shell: bash
        run: >-
          node scripts/stage-native-binary.mjs
          packages/${{ matrix.package }}
          target/${{ matrix.target }}/release/${{ matrix.executable }}

      - name: Verify staged platform package
        run: node scripts/check-native-package.mjs packages/${{ matrix.package }}

      - name: Smoke test packed npm launcher
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: node scripts/check-package.mjs

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}
          if-no-files-found: error
