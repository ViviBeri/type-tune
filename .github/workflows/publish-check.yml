name: Publish Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-pnpm

      - name: Publish check
        run: pnpm publish:check
