name: Recover type-tune 1.0.0 root package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Only 1.0.0 is supported"
        required: true
        default: "1.0.0"
        type: string
      dry_run:
        description: "Validate only; do not publish"
        required: true
        default: true
        type: boolean
      confirmation:
        description: "For publication, enter PUBLISH type-tune@1.0.0"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-refs/tags/v1.0.0
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Require main workflow ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Checkout recovery controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
      - name: Checkout original release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.0.0
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Validate request and original source
        env:
          REQUEST_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node control/scripts/v1-root-recovery.mjs request "$REQUEST_VERSION" "$DRY_RUN" "$CONFIRMATION"
          node control/scripts/v1-root-recovery.mjs source release "$REQUEST_VERSION"
      - name: Check authenticated npm registry state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node control/scripts/v1-root-recovery.mjs registry
      - name: Pack original release without lifecycle scripts
        working-directory: release
        run: |
          mkdir -p "$RUNNER_TEMP/v1-root-recovery"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/v1-root-recovery" > "$RUNNER_TEMP/v1-root-pack.json"
      - name: Verify packed manifest, files and installed executable
        id: tarball
        run: node control/scripts/v1-root-recovery.mjs tarball "$RUNNER_TEMP/v1-root-recovery/type-tune-1.0.0.tgz"
      - name: Recheck registry and verified tarball before publishing
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_DIGEST: ${{ steps.tarball.outputs.sha256 }}
        run: |
          node control/scripts/v1-root-recovery.mjs registry
          node control/scripts/v1-root-recovery.mjs digest "$RUNNER_TEMP/v1-root-recovery/type-tune-1.0.0.tgz" "$EXPECTED_DIGEST"
      - name: Publish verified root tarball once
        id: publish
        if: ${{ !inputs.dry_run && inputs.version == '1.0.0' && inputs.confirmation == 'PUBLISH type-tune@1.0.0' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/v1-root-recovery/type-tune-1.0.0.tgz" --ignore-scripts --access public --provenance
      - name: Report registry state after a failed publish
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node control/scripts/v1-root-recovery.mjs report
