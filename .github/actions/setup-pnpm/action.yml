name: Setup pnpm project
description: Setup Node, enable pnpm, restore the pnpm store cache, and install dependencies.

inputs:
  node-version:
    description: Node.js version used for the job.
    required: false
    default: "24"
  registry-url:
    description: Optional npm registry URL for publish workflows.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.registry-url == ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Node with registry
      if: inputs.registry-url != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Enable pnpm
      shell: bash
      run: corepack enable

    - name: Get pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
